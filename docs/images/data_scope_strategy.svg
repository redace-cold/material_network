<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <style>.box{fill:#fff;stroke:#1f2937;stroke-width:2.4;rx:16}.h{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:28px;font-weight:700;fill:#111827}.t{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:22px;font-weight:700;fill:#111827}.s{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;fill:#374151}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="40" y="45" class="h">Dataset relationship: training set and target-system application</text>
  <rect x="70" y="95" width="500" height="300" class="box" fill="#eff6ff"/>
  <text x="105" y="140" class="t">all_data</text><text x="105" y="178" class="s">148 valid samples</text><text x="105" y="215" class="s">Target BNT-KNN-SBCT + related dielectric ceramics</text><text x="105" y="252" class="s">Used for: Pearson pruning, feature ranking, model selection</text><text x="105" y="289" class="s">X is excluded because X differs among material systems</text><text x="105" y="326" class="s">Occupancy fractions are retained to identify systems</text>
  <line x1="570" y1="245" x2="710" y2="245" class="arrow"/>
  <rect x="710" y="95" width="500" height="300" class="box" fill="#f0fdf4"/>
  <text x="745" y="140" class="t">main_system</text><text x="745" y="178" class="s">101 BNT-KNN-xSBCT samples</text><text x="745" y="215" class="s">Target composition series with meaningful x coordinate</text><text x="745" y="252" class="s">Uses features learned from all_data</text><text x="745" y="289" class="s">Used for: candidate ranking and x-window evaluation</text><text x="745" y="326" class="s">Occupancy fractions are collinear with x and are dropped</text>
  <text x="280" y="455" class="t">Main logic: learn robust descriptor-property relations first, then apply them to the target composition series.</text>
</svg>
