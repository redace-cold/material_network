<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <style>.txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-weight:700;fill:#111827}.h{font-size:28px}.t{font-size:22px}.s{font-size:17px;font-weight:600;fill:#374151}.cube{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}.b{fill:#f97316}.a{fill:#2563eb}.o{fill:#dc2626}.box{fill:#fff;stroke:#1f2937;stroke-width:2;rx:12}</style>
  <text x="40" y="45" class="txt h">Perovskite descriptor map: ABO3 structure and physics-based features</text>
  <rect x="90" y="110" width="330" height="330" class="cube"/>
  <line x1="90" y1="110" x2="180" y2="45" stroke="#0284c7" stroke-width="3"/><line x1="420" y1="110" x2="510" y2="45" stroke="#0284c7" stroke-width="3"/><line x1="420" y1="440" x2="510" y2="375" stroke="#0284c7" stroke-width="3"/><line x1="180" y1="45" x2="510" y2="45" stroke="#0284c7" stroke-width="3"/><line x1="510" y1="45" x2="510" y2="375" stroke="#0284c7" stroke-width="3"/><line x1="180" y1="45" x2="180" y2="375" stroke="#0284c7" stroke-width="3"/><line x1="180" y1="375" x2="510" y2="375" stroke="#0284c7" stroke-width="3"/><line x1="90" y1="440" x2="180" y2="375" stroke="#0284c7" stroke-width="3"/>
  <circle cx="90" cy="110" r="15" class="a"/><circle cx="420" cy="110" r="15" class="a"/><circle cx="90" cy="440" r="15" class="a"/><circle cx="420" cy="440" r="15" class="a"/><circle cx="255" cy="275" r="20" class="b"/><circle cx="255" cy="110" r="14" class="o"/><circle cx="255" cy="440" r="14" class="o"/><circle cx="90" cy="275" r="14" class="o"/><circle cx="420" cy="275" r="14" class="o"/><circle cx="255" cy="275" r="58" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="130" y="505" class="txt s">A-site ions: Bi/Na/K/Sr/Ca etc.</text><text x="130" y="530" class="txt s">B-site ions: Ti/Nb/Zr/etc.; oxygen builds BO6 octahedra</text>
  <rect x="600" y="95" width="580" height="360" class="box"/><text x="630" y="140" class="txt t">Descriptor mechanisms</text>
  <text x="630" y="185" class="txt s">Tolerance factor:  t = (rA + rO) / [sqrt(2)(rB + rO)]</text>
  <text x="630" y="222" class="txt s">Octahedral factor:  μ = rB / rO</text>
  <text x="630" y="259" class="txt s">Radius variance: local lattice strain and size disorder</text>
  <text x="630" y="296" class="txt s">Configurational entropy: multi-ion mixing disorder</text>
  <text x="630" y="333" class="txt s">Electronegativity mismatch: bonding and local electric field variation</text>
  <text x="630" y="370" class="txt s">Valence mismatch: charge disorder and defect tendency</text>
  <text x="630" y="407" class="txt s">Occupancy fractions: system-specific A/B-site composition signals</text>
</svg>
