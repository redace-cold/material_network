<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470">
  <style>.box{fill:#fff;stroke:#1f2937;stroke-width:2.4;rx:14}.a{fill:#dbeafe;stroke:#2563eb}.b{fill:#dcfce7;stroke:#16a34a}.c{fill:#f3e8ff;stroke:#9333ea}.d{fill:#fee2e2;stroke:#dc2626}.txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:23px;font-weight:700;fill:#111827}.h{font-size:28px}.s{font-size:17px;font-weight:600;fill:#374151}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="40" y="45" class="txt h">Dual-objective regression and candidate ranking</text>
  <rect x="65" y="105" width="240" height="110" class="box a"/><text x="95" y="145" class="txt">Top-10 descriptors</text><text x="95" y="180" class="s">learned from all_data</text>
  <line x1="305" y1="160" x2="390" y2="160" class="arrow"/>
  <rect x="390" y="80" width="230" height="90" class="box b"/><text x="420" y="118" class="txt">Regressor 1</text><text x="420" y="150" class="s">predict Wrec</text>
  <rect x="390" y="220" width="230" height="90" class="box b"/><text x="420" y="258" class="txt">Regressor 2</text><text x="420" y="290" class="s">predict η</text>
  <line x1="620" y1="125" x2="720" y2="195" class="arrow"/><line x1="620" y1="265" x2="720" y2="225" class="arrow"/>
  <rect x="720" y="150" width="245" height="120" class="box c"/><text x="750" y="190" class="txt">Screening rules</text><text x="750" y="224" class="s">Pareto front</text><text x="750" y="250" class="s">Score = 0.5 Wrecnorm + 0.5 ηnorm</text>
  <line x1="965" y1="210" x2="1050" y2="210" class="arrow"/>
  <rect x="1050" y="150" width="180" height="120" class="box d"/><text x="1080" y="190" class="txt">Output</text><text x="1080" y="224" class="s">ranked candidates</text><text x="1080" y="250" class="s">x ≈ 0.16 window</text>
  <text x="150" y="395" class="txt">Why dual target?  Wrec describes energy density; η describes loss. Screening both avoids selecting high-Wrec but inefficient compositions.</text>
</svg>
