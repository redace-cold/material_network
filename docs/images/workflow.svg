<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <style>
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2.4;rx:14;ry:14}
    .blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.orange{fill:#ffedd5;stroke:#ea580c}.purple{fill:#f3e8ff;stroke:#9333ea}.red{fill:#fee2e2;stroke:#dc2626}
    .txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#111827}.sub{font-size:18px;font-weight:600;fill:#374151}.small{font-size:15px;font-weight:600;fill:#4b5563}
    .arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="40" y="42" class="txt">Software workflow: descriptor-driven dual-objective screening</text>
  <rect x="35" y="85" width="180" height="120" class="box blue"/><text x="60" y="125" class="txt">Excel input</text><text x="60" y="158" class="sub">ML-4 数据收集</text><text x="60" y="184" class="small">sheet: ML描述符</text>
  <line x1="215" y1="145" x2="285" y2="145" class="arrow"/>
  <rect x="285" y="85" width="205" height="120" class="box green"/><text x="310" y="122" class="txt">Feature pool</text><text x="310" y="155" class="sub">55 descriptors</text><text x="310" y="182" class="small">A/B chemistry + physics</text>
  <line x1="490" y1="145" x2="560" y2="145" class="arrow"/>
  <rect x="560" y="85" width="200" height="120" class="box orange"/><text x="585" y="122" class="txt">Feature selection</text><text x="585" y="155" class="sub">Pearson + importance</text><text x="585" y="182" class="small">20 pruned → top 10</text>
  <line x1="760" y1="145" x2="830" y2="145" class="arrow"/>
  <rect x="830" y="85" width="185" height="120" class="box purple"/><text x="855" y="122" class="txt">Model CV</text><text x="855" y="155" class="sub">7 regressors</text><text x="855" y="182" class="small">Repeated K-fold MAE</text>
  <line x1="1015" y1="145" x2="1085" y2="145" class="arrow"/>
  <rect x="1085" y="85" width="160" height="120" class="box red"/><text x="1110" y="122" class="txt">Screening</text><text x="1110" y="155" class="sub">Wrec + η</text><text x="1110" y="182" class="small">Pareto + score</text>
  <rect x="180" y="275" width="420" height="80" class="box"/><text x="205" y="308" class="sub">all_data: model construction, feature learning, model comparison</text><text x="205" y="335" class="small">X excluded because it is not universal across systems</text>
  <line x1="600" y1="315" x2="705" y2="315" class="arrow"/>
  <rect x="705" y="275" width="430" height="80" class="box"/><text x="730" y="308" class="sub">main_system: BNT-KNN-xSBCT target composition series</text><text x="730" y="335" class="small">candidate window around x ≈ 0.16 within collected samples</text>
</svg>
