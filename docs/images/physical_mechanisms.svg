<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <style>.box{fill:#fff;stroke:#1f2937;stroke-width:2.4;rx:14}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.orange{fill:#ffedd5;stroke:#ea580c}.red{fill:#fee2e2;stroke:#dc2626}.txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:22px;font-weight:700;fill:#111827}.h{font-size:28px}.s{font-size:17px;font-weight:600;fill:#374151}.arrow{stroke:#111827;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="40" y="45" class="txt h">Physical mechanism chain for energy-storage ceramics</text>
  <rect x="65" y="95" width="255" height="310" class="box blue"/><text x="95" y="135" class="txt">Input descriptors</text><text x="95" y="180" class="s">t, μ</text><text x="95" y="215" class="s">radius variance</text><text x="95" y="250" class="s">entropy</text><text x="95" y="285" class="s">electronegativity mismatch</text><text x="95" y="320" class="s">valence mismatch</text><text x="95" y="355" class="s">A/B occupancy fractions</text>
  <line x1="320" y1="250" x2="405" y2="250" class="arrow"/>
  <rect x="405" y="95" width="285" height="310" class="box orange"/><text x="435" y="135" class="txt">Structure effects</text><text x="435" y="180" class="s">perovskite size matching</text><text x="435" y="215" class="s">BO6 octahedral stability</text><text x="435" y="250" class="s">local lattice distortion</text><text x="435" y="285" class="s">random field / charge disorder</text><text x="435" y="320" class="s">polar nanoregions</text><text x="435" y="355" class="s">relaxor-like response</text>
  <line x1="690" y1="250" x2="775" y2="250" class="arrow"/>
  <rect x="775" y="95" width="220" height="310" class="box green"/><text x="805" y="135" class="txt">Electrical response</text><text x="805" y="185" class="s">reduced hysteresis</text><text x="805" y="225" class="s">lower Pr</text><text x="805" y="265" class="s">higher breakdown field</text><text x="805" y="305" class="s">slim P-E loops</text><text x="805" y="345" class="s">stable polarization</text>
  <line x1="995" y1="250" x2="1080" y2="250" class="arrow"/>
  <rect x="1080" y="95" width="160" height="310" class="box red"/><text x="1110" y="135" class="txt">Targets</text><text x="1110" y="210" class="s">High Wrec</text><text x="1110" y="255" class="s">High η</text><text x="1110" y="300" class="s">Balanced score</text>
  <text x="170" y="475" class="txt">The model uses physically meaningful descriptors to connect composition, local structure, polarization behavior, and energy-storage performance.</text>
</svg>
